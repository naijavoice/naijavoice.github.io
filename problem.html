<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NaijaVoice – Problem Detail</title>
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#008751"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root{--green:#008751;--green-light:#00a863;--green-dark:#005c37;--gold:#f5a623;--cream:#fdf6ec;--dark:#0d1f0f;--text:#1a2e1c;--muted:#5a7a5e;--border:#d4e8d6;--card:#ffffff;--error:#e53e3e;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text);}
    nav{display:flex;align-items:center;justify-content:space-between;padding:1.1rem 5%;background:rgba(253,246,236,0.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
    .logo-wrap{display:flex;align-items:center;gap:0.5rem;text-decoration:none;}
    .logo-icon{width:32px;height:32px;background:var(--green);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1rem;}
    .logo-text{font-family:'Syne',sans-serif;font-weight:800;font-size:1.35rem;color:var(--green);}
    .logo-text span{color:var(--gold);}
    .nav-right{display:flex;align-items:center;gap:1rem;}
    .nav-user{font-size:0.85rem;color:var(--green);font-weight:600;text-decoration:none;}
    .nav-logout{background:none;border:1px solid var(--border);color:var(--muted);font-size:0.78rem;padding:0.35rem 0.8rem;border-radius:50px;cursor:pointer;font-family:'DM Sans',sans-serif;}
    .back-bar{padding:1rem 5%;max-width:860px;margin:0 auto;}
    .back-btn{display:inline-flex;align-items:center;gap:0.5rem;color:var(--muted);font-size:0.88rem;text-decoration:none;background:var(--card);border:1px solid var(--border);padding:0.5rem 1rem;border-radius:50px;transition:all 0.2s;}
    .back-btn:hover{color:var(--green);border-color:var(--green);}
    .loading-screen{min-height:60vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1rem;}
    .spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin 0.8s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .main-wrap{max-width:860px;margin:0 auto;padding:0 5% 3rem;}
    .problem-hero{background:var(--dark);border-radius:20px;padding:2rem;margin-bottom:1.5rem;position:relative;overflow:hidden;}
    .problem-hero::before{content:'';position:absolute;top:-80px;right:-80px;width:250px;height:250px;border-radius:50%;background:radial-gradient(circle,rgba(0,135,81,0.2) 0%,transparent 70%);pointer-events:none;}
    .problem-meta{display:flex;align-items:center;gap:0.6rem;flex-wrap:wrap;margin-bottom:1rem;}
    .meta-cat{display:inline-flex;align-items:center;gap:0.3rem;background:rgba(0,135,81,0.2);border:1px solid rgba(0,135,81,0.35);color:var(--green-light);font-size:0.72rem;font-weight:600;padding:0.2rem 0.7rem;border-radius:50px;}
    .meta-loc{font-size:0.75rem;color:rgba(255,255,255,0.45);}
    .meta-time{font-size:0.72rem;color:rgba(255,255,255,0.35);}
    .urgency-badge{font-size:0.7rem;font-weight:600;padding:0.2rem 0.6rem;border-radius:50px;}
    .ub-high{background:rgba(229,62,62,0.2);color:#fc8181;}
    .ub-medium{background:rgba(245,166,35,0.2);color:var(--gold);}
    .ub-low{background:rgba(56,161,105,0.2);color:#68d391;}
    .problem-title{font-family:'Syne',sans-serif;font-size:clamp(1.3rem,4vw,1.8rem);font-weight:800;color:#fff;line-height:1.2;margin-bottom:0.8rem;}
    .problem-desc{color:rgba(255,255,255,0.65);font-size:0.92rem;line-height:1.8;margin-bottom:0.8rem;}
    .posted-by{font-size:0.78rem;color:rgba(255,255,255,0.4);margin-bottom:1.2rem;}
    .posted-by strong{color:rgba(255,255,255,0.7);}
    .vote-section{display:flex;align-items:center;gap:1.5rem;padding:1.2rem;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:14px;margin-bottom:1.2rem;flex-wrap:wrap;}
    .vote-big-btn{display:flex;align-items:center;gap:0.7rem;background:var(--green);color:#fff;border:none;padding:0.8rem 1.5rem;border-radius:12px;font-family:'Syne',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;transition:all 0.2s;box-shadow:0 4px 16px rgba(0,135,81,0.35);}
    .vote-big-btn:hover{background:var(--green-dark);transform:translateY(-2px);}
    .vote-big-btn.voted{background:rgba(0,135,81,0.2);border:2px solid var(--green-light);color:var(--green-light);box-shadow:none;}
    .vote-stats{display:flex;flex-direction:column;}
    .vote-count-big{font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:800;color:#fff;line-height:1;}
    .vote-count-label{font-size:0.78rem;color:rgba(255,255,255,0.4);margin-top:0.2rem;}
    .share-row{margin-left:auto;display:flex;gap:0.6rem;flex-wrap:wrap;}
    .share-platform{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.7);padding:0.5rem 0.9rem;border-radius:8px;cursor:pointer;font-size:0.82rem;font-family:'DM Sans',sans-serif;transition:background 0.2s;}
    .share-platform:hover{background:rgba(255,255,255,0.15);}
    .details-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0.8rem;margin-bottom:1.5rem;}
    .detail-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1rem;}
    .detail-label{font-size:0.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:0.3rem;}
    .detail-value{font-family:'Syne',sans-serif;font-size:0.88rem;font-weight:700;color:var(--dark);}
    /* EDIT PROBLEM */
    .edit-problem-form{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1.5rem;display:none;}
    .edit-problem-form.show{display:block;animation:fadeUp 0.3s ease both;}
    .edit-problem-form h4{font-family:'Syne',sans-serif;font-size:0.95rem;font-weight:800;color:var(--dark);margin-bottom:1rem;}
    .edit-problem-form input,.edit-problem-form textarea{width:100%;padding:0.7rem 0.9rem;border:1.5px solid var(--border);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:0.9rem;color:var(--text);outline:none;margin-bottom:0.8rem;resize:vertical;}
    .edit-problem-form input:focus,.edit-problem-form textarea:focus{border-color:var(--green);}
    .edit-actions{display:flex;gap:0.8rem;margin-top:0.5rem;}
    .save-btn{background:var(--green);color:#fff;border:none;padding:0.65rem 1.4rem;border-radius:8px;font-family:'Syne',sans-serif;font-size:0.85rem;font-weight:700;cursor:pointer;}
    .cancel-edit-btn{background:transparent;border:1.5px solid var(--border);color:var(--muted);padding:0.65rem 1.2rem;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:0.85rem;cursor:pointer;}
    /* OWNER ACTIONS */
    .owner-actions{display:flex;gap:0.6rem;margin-bottom:1.2rem;flex-wrap:wrap;}
    .owner-btn{padding:0.45rem 1rem;border-radius:8px;border:none;font-family:'DM Sans',sans-serif;font-size:0.8rem;font-weight:600;cursor:pointer;transition:all 0.2s;display:inline-flex;align-items:center;gap:0.3rem;}
    .btn-edit-post{background:rgba(0,135,81,0.1);color:var(--green-dark);}
    .btn-edit-post:hover{background:var(--green);color:#fff;}
    .btn-delete-post{background:rgba(229,62,62,0.1);color:#c53030;}
    .btn-delete-post:hover{background:var(--error);color:#fff;}
    /* COMMENTS */
    .comments-section{background:var(--card);border:1px solid var(--border);border-radius:20px;overflow:hidden;margin-bottom:2rem;}
    .comments-header{padding:1.3rem 1.5rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
    .comments-header h3{font-family:'Syne',sans-serif;font-size:1rem;font-weight:800;color:var(--dark);}
    .comment-count-badge{background:rgba(0,135,81,0.1);color:var(--green);font-size:0.75rem;font-weight:700;padding:0.2rem 0.6rem;border-radius:50px;}
    .comment-form{padding:1.5rem;border-bottom:1px solid var(--border);background:#fafef8;}
    .comment-form textarea{width:100%;padding:0.8rem 1rem;border:1.5px solid var(--border);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:0.9rem;color:var(--text);resize:vertical;min-height:80px;outline:none;line-height:1.6;transition:border-color 0.2s;background:#fff;}
    .comment-form textarea:focus{border-color:var(--green);}
    .form-footer{display:flex;align-items:center;justify-content:space-between;margin-top:0.8rem;flex-wrap:wrap;gap:0.8rem;}
    .char-count{font-size:0.75rem;color:var(--muted);}
    .submit-comment{background:var(--green);color:#fff;border:none;padding:0.65rem 1.4rem;border-radius:8px;font-family:'Syne',sans-serif;font-size:0.88rem;font-weight:700;cursor:pointer;transition:background 0.2s;}
    .submit-comment:hover{background:var(--green-dark);}
    .submit-comment:disabled{opacity:0.6;cursor:not-allowed;}
    .login-prompt{font-size:0.85rem;color:var(--muted);padding:1.2rem 1.5rem;background:#fafef8;border-bottom:1px solid var(--border);}
    .login-prompt a{color:var(--green);font-weight:600;text-decoration:none;}
    .comments-list{padding:0;}
    /* COMMENT ITEM */
    .comment-item{padding:1.2rem 1.5rem;border-bottom:1px solid #f0f7f0;animation:fadeUp 0.3s ease both;}
    .comment-item:last-child{border-bottom:none;}
    .comment-header{display:flex;align-items:center;gap:0.7rem;margin-bottom:0.6rem;}
    .comment-avatar{width:36px;height:36px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:0.85rem;font-weight:800;color:#fff;flex-shrink:0;}
    .comment-author{font-family:'Syne',sans-serif;font-size:0.85rem;font-weight:700;color:var(--dark);}
    .comment-time{font-size:0.72rem;color:var(--muted);margin-left:auto;}
    .comment-text{font-size:0.88rem;color:var(--text);line-height:1.65;margin-bottom:0.6rem;}
    /* COMMENT EDIT */
    .comment-edit-form{display:none;margin-bottom:0.6rem;}
    .comment-edit-form.show{display:block;}
    .comment-edit-form textarea{width:100%;padding:0.6rem 0.8rem;border:1.5px solid var(--border);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:0.85rem;resize:vertical;min-height:60px;outline:none;}
    .comment-edit-form textarea:focus{border-color:var(--green);}
    .comment-edit-actions{display:flex;gap:0.5rem;margin-top:0.4rem;}
    .ce-save{background:var(--green);color:#fff;border:none;padding:0.4rem 0.9rem;border-radius:6px;font-family:'Syne',sans-serif;font-size:0.78rem;font-weight:700;cursor:pointer;}
    .ce-cancel{background:transparent;border:1px solid var(--border);color:var(--muted);padding:0.4rem 0.7rem;border-radius:6px;font-family:'DM Sans',sans-serif;font-size:0.78rem;cursor:pointer;}
    /* COMMENT ACTIONS */
    .comment-actions{display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;}
    .like-btn{background:none;border:1px solid var(--border);color:var(--muted);font-size:0.75rem;padding:0.22rem 0.6rem;border-radius:50px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.2s;display:inline-flex;align-items:center;gap:0.3rem;}
    .like-btn:hover{border-color:var(--green);color:var(--green);}
    .like-btn.liked{background:rgba(0,135,81,0.08);border-color:var(--green);color:var(--green);}
    .reply-btn{background:none;border:none;color:var(--muted);font-size:0.75rem;padding:0.22rem 0.5rem;border-radius:50px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:color 0.2s;}
    .reply-btn:hover{color:var(--green);}
    .edit-comment-btn{background:none;border:none;color:var(--muted);font-size:0.75rem;padding:0.22rem 0.5rem;border-radius:50px;cursor:pointer;font-family:'DM Sans',sans-serif;}
    .edit-comment-btn:hover{color:var(--green);}
    .delete-comment-btn{background:none;border:none;color:#e53e3e;font-size:0.75rem;padding:0.22rem 0.5rem;border-radius:50px;cursor:pointer;font-family:'DM Sans',sans-serif;}
    /* REPLIES */
    .replies-wrap{margin-top:0.8rem;padding-left:1.5rem;border-left:2px solid var(--border);}
    .reply-item{padding:0.8rem 0;border-bottom:1px solid #f5faf5;}
    .reply-item:last-child{border-bottom:none;}
    .reply-header{display:flex;align-items:center;gap:0.6rem;margin-bottom:0.4rem;}
    .reply-avatar{width:28px;height:28px;border-radius:50%;background:var(--green-light);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:0.72rem;font-weight:800;color:#fff;flex-shrink:0;}
    .reply-author{font-family:'Syne',sans-serif;font-size:0.78rem;font-weight:700;color:var(--dark);}
    .reply-time{font-size:0.68rem;color:var(--muted);margin-left:auto;}
    .reply-text{font-size:0.82rem;color:var(--text);line-height:1.55;}
    .reply-delete{background:none;border:none;color:#e53e3e;font-size:0.7rem;cursor:pointer;margin-left:auto;}
    /* REPLY FORM */
    .reply-form{display:none;margin-top:0.8rem;padding:0.8rem;background:#f8fdf8;border-radius:10px;border:1px solid var(--border);}
    .reply-form.show{display:block;}
    .reply-form textarea{width:100%;padding:0.6rem 0.8rem;border:1.5px solid var(--border);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:0.85rem;resize:none;min-height:60px;outline:none;background:#fff;}
    .reply-form textarea:focus{border-color:var(--green);}
    .reply-form-actions{display:flex;gap:0.5rem;margin-top:0.5rem;}
    .reply-submit{background:var(--green);color:#fff;border:none;padding:0.45rem 1rem;border-radius:8px;font-family:'Syne',sans-serif;font-size:0.8rem;font-weight:700;cursor:pointer;}
    .reply-cancel{background:transparent;border:1px solid var(--border);color:var(--muted);padding:0.45rem 0.8rem;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:0.8rem;cursor:pointer;}
    .no-comments{text-align:center;padding:3rem 2rem;}
    .no-comments p{color:var(--muted);font-size:0.88rem;line-height:1.6;}
    .toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(100px);background:var(--dark);color:#fff;padding:0.9rem 1.6rem;border-radius:50px;font-size:0.88rem;font-weight:500;box-shadow:0 8px 30px rgba(0,0,0,0.25);transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1);z-index:9999;white-space:nowrap;}
    .toast.show{transform:translateX(-50%) translateY(0);}
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
    @media(max-width:600px){.share-row{margin-left:0;}.vote-section{gap:1rem;}.details-grid{grid-template-columns:1fr 1fr;}}
  </style>
</head>
<body>
<nav>
  <a href="index.html" class="logo-wrap">
    <div class="logo-icon">🗳️</div>
    <div class="logo-text">Naija<span>Voice</span></div>
  </a>
  <div class="nav-right" id="nav-auth-area"></div>
</nav>

<div class="loading-screen" id="loading-screen">
  <div class="spinner"></div>
  <p style="color:var(--muted);font-size:0.9rem;">Loading problem...</p>
</div>

<div id="page-content" style="display:none;">
  <div class="back-bar">
    <a href="feed.html" class="back-btn">⬅️ Back to Problems</a>
  </div>
  <div class="main-wrap">
    <div class="problem-hero">
      <div class="problem-meta" id="problem-meta"></div>
      <h1 class="problem-title" id="problem-title">Loading...</h1>
      <p class="problem-desc" id="problem-desc"></p>
      <p class="posted-by" id="posted-by"></p>
      <div class="vote-section">
        <button class="vote-big-btn" id="vote-btn" onclick="castVote()">👍 Vote for this Problem</button>
        <div class="vote-stats">
          <div class="vote-count-big" id="vote-count">0</div>
          <div class="vote-count-label">Nigerians voted on this</div>
        </div>
        <div class="share-row">
          <button class="share-platform" onclick="shareTwitter()">🐦 Tweet</button>
          <button class="share-platform" onclick="shareWhatsApp()">📱 WhatsApp</button>
          <button class="share-platform" onclick="copyLink()">🔗 Copy</button>
          <button class="share-platform" style="color:#e53e3e;border-color:rgba(229,62,62,0.3);" onclick="showReportModal(problemId,problemData?.title)">🚩 Report</button>
        </div>
      </div>
      <div class="owner-actions" id="owner-actions" style="display:none;">
        <button class="owner-btn btn-edit-post" onclick="toggleEditProblem()">✏️ Edit Post</button>
        <button class="owner-btn btn-delete-post" onclick="deleteProblem()">🗑️ Delete Post</button>
      </div>
    </div>

    <!-- EDIT PROBLEM FORM -->
    <div class="edit-problem-form" id="edit-problem-form">
      <h4>✏️ Edit Your Post</h4>
      <input type="text" id="edit-title" placeholder="Problem title" maxlength="100"/>
      <textarea id="edit-desc" placeholder="Problem description..." rows="5" maxlength="800"></textarea>
      <div class="edit-actions">
        <button class="save-btn" onclick="saveEditProblem()">💾 Save Changes</button>
        <button class="cancel-edit-btn" onclick="toggleEditProblem()">Cancel</button>
      </div>
    </div>

    <div class="details-grid" id="details-grid"></div>

    <!-- COMMENTS SECTION -->
    <div class="comments-section">
      <div class="comments-header">
        <h3>💬 Community Discussion</h3>
        <span class="comment-count-badge" id="comment-count">0 comments</span>
      </div>
      <div id="comment-form-area"></div>
      <div class="comments-list" id="comments-list">
        <div class="no-comments"><p>No comments yet. Be the first!</p></div>
      </div>
    </div>
  </div>
</div>

<div id="not-found" style="display:none;min-height:60vh;align-items:center;justify-content:center;flex-direction:column;gap:1rem;text-align:center;padding:2rem;">
  <div style="font-size:4rem;">😕</div>
  <h2 style="font-family:'Syne',sans-serif;font-size:1.3rem;font-weight:800;color:var(--dark);">Problem Not Found</h2>
  <a href="feed.html" class="back-btn" style="margin-top:1rem;">⬅️ Back to Feed</a>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const _sb = supabase.createClient(
  'https://zszcmrbbgchafoydqoqb.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpzemNtcmJiZ2NoYWZveWRxb3FiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4NzEwMTMsImV4cCI6MjA5MDQ0NzAxM30.9II959A9wOzXrVi1TEU7mtyqY2v-NFubLC7m_yOIE1U'
);

let problemData=null, currentUser=null, hasVoted=false;
let likedComments = JSON.parse(localStorage.getItem('nv_liked_comments')||'[]');
const problemId = new URLSearchParams(window.location.search).get('id');

function showToast(msg){const t=document.getElementById('toast');t.innerHTML=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3200);}
function timeAgo(ts){if(!ts)return'';const d=Math.floor((Date.now()-new Date(ts))/1000);if(d<60)return'Just now';if(d<3600)return Math.floor(d/60)+'m ago';if(d<86400)return Math.floor(d/3600)+'h ago';return Math.floor(d/86400)+'d ago';}
function urgencyClass(u){return u==='high'?'ub-high':u==='medium'?'ub-medium':'ub-low';}
function urgencyLabel(u){return u==='high'?'🔴 Critical':u==='medium'?'🟠 Medium':'🟡 Low';}
function getInitials(name){return(name||'??').split(' ').map(n=>n[0]).join('').slice(0,2).toUpperCase();}

async function init(){
  if(!problemId){showNotFound();return;}
  try{
    const {data:{user}}=await _sb.auth.getUser();
    currentUser=user;
    if(user){
      const {data:p}=await _sb.from('profiles').select('full_name').eq('id',user.id).single();
      const name=p?.full_name?.split(' ')[0]||'User';
      document.getElementById('nav-auth-area').innerHTML=
        '<a href="profile.html" class="nav-user">👤 '+name+'</a>'+
        '<button class="nav-logout" onclick="logout()">Logout</button>';
      const {data:vote}=await _sb.from('votes').select('id').eq('user_id',user.id).eq('problem_id',problemId).single();
      hasVoted=!!vote;
    }
    const {data:problem,error}=await _sb.from('problems').select('*').eq('id',problemId).single();
    if(error||!problem){showNotFound();return;}
    if(problem.hidden){showUnderReview();return;}
    problemData=problem;
    await renderProblem();
    renderCommentForm();
    await loadComments();
    document.getElementById('loading-screen').style.display='none';
    document.getElementById('page-content').style.display='block';
  }catch(e){console.error(e);showNotFound();}
}

function showNotFound(){
  document.getElementById('loading-screen').style.display='none';
  const nf=document.getElementById('not-found');
  nf.style.display='flex';
}

function showUnderReview(){
  document.getElementById('loading-screen').style.display='none';
  const nf=document.getElementById('not-found');
  nf.style.display='flex';
  nf.innerHTML='<div style="font-size:4rem;margin-bottom:1rem;">🛡️</div><h2 style="font-family:Syne,sans-serif;font-size:1.3rem;font-weight:800;color:var(--dark);margin-bottom:0.5rem;">Post Under Review</h2><p style="color:var(--muted);font-size:0.9rem;line-height:1.6;max-width:360px;text-align:center;">This post has been flagged for moderation review and is temporarily unavailable.</p><a href="feed.html" class="back-btn" style="margin-top:1rem;">⬅️ Back to Feed</a>';
}

  const p=problemData;
  document.title='NaijaVoice - '+p.title;
  let posterName='Anonymous';
  if(p.user_id){
    const {data:poster}=await _sb.from('profiles').select('full_name').eq('id',p.user_id).single();
    if(poster?.full_name)posterName=poster.full_name;
  }
  document.getElementById('problem-meta').innerHTML=
    '<span class="meta-cat">'+(p.category_icon||'📋')+' '+(p.category||'General')+'</span>'+
    '<span class="meta-loc">📍 '+(p.state||'Nigeria')+' · '+(p.lga||'')+'</span>'+
    '<span class="urgency-badge '+urgencyClass(p.urgency)+'">'+urgencyLabel(p.urgency)+'</span>'+
    '<span class="meta-time">'+timeAgo(p.created_at)+'</span>';
  document.getElementById('problem-title').textContent=p.title;
  document.getElementById('problem-desc').textContent=p.description;
  document.getElementById('posted-by').innerHTML='✍️ Posted by <strong>'+posterName+'</strong>';
  const voteBtn=document.getElementById('vote-btn');
  if(hasVoted){voteBtn.classList.add('voted');voteBtn.innerHTML='✅ You Voted on This';}
  document.getElementById('vote-count').textContent=(p.votes||0).toLocaleString();
  document.getElementById('details-grid').innerHTML=[
    {label:'📍 State',value:p.state||'—'},
    {label:'🏘️ LGA',value:p.lga||'—'},
    {label:'👥 People Affected',value:p.affected||'—'},
    {label:'📅 Duration',value:p.duration||'—'},
    {label:'🏛️ Authorities Informed',value:p.govt_reported||'—'},
    {label:'🗳️ Total Votes',value:(p.votes||0).toLocaleString()},
  ].map(d=>'<div class="detail-item"><div class="detail-label">'+d.label+'</div><div class="detail-value">'+d.value+'</div></div>').join('');
  // Show owner actions
  if(currentUser&&p.user_id===currentUser.id){
    document.getElementById('owner-actions').style.display='flex';

  }
}

// ── EDIT PROBLEM ──
function toggleEditProblem(){
  document.getElementById('edit-problem-form').classList.toggle('show');
}

async function saveEditProblem(){
  const title=document.getElementById('edit-title').value.trim();
  const desc=document.getElementById('edit-desc').value.trim();
  if(!title||!desc){showToast('⚠️ Please fill in title and description.');return;}
  const {error}=await _sb.from('problems').update({title,description:desc}).eq('id',problemId).eq('user_id',currentUser.id);
  if(error){showToast('❌ Could not save. Try again.');return;}
  problemData.title=title;
  problemData.description=desc;
  document.getElementById('problem-title').textContent=title;
  document.getElementById('problem-desc').textContent=desc;
  toggleEditProblem();
  showToast('✅ Post updated successfully!');
}

// ── DELETE PROBLEM ──
async function deleteProblem(){
  const overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:99999;display:flex;align-items:center;justify-content:center;padding:2rem;';
  overlay.innerHTML='<div style="background:#fff;border-radius:20px;padding:2rem;max-width:300px;width:100%;text-align:center;"><div style="font-size:2.5rem;margin-bottom:0.8rem;">🗑️</div><h3 style="font-family:Syne,sans-serif;font-size:1.1rem;font-weight:800;color:#0d1f0f;margin-bottom:0.5rem;">Delete This Post?</h3><p style="font-size:0.85rem;color:#5a7a5e;margin-bottom:1.5rem;line-height:1.5;">This will be permanently removed and cannot be undone.</p><div style="display:flex;gap:0.8rem;"><button id="del-cancel" style="flex:1;padding:0.8rem;border:2px solid #d4e8d6;border-radius:10px;background:transparent;font-size:0.9rem;cursor:pointer;color:#5a7a5e;">Cancel</button><button id="del-confirm" style="flex:1;padding:0.8rem;border:none;border-radius:10px;background:#e53e3e;color:#fff;font-family:Syne,sans-serif;font-size:0.9rem;font-weight:700;cursor:pointer;">Yes, Delete</button></div></div>';
  document.body.appendChild(overlay);
  document.getElementById('del-cancel').onclick=()=>overlay.remove();
  document.getElementById('del-confirm').onclick=async()=>{
    overlay.remove();
    // First delete related votes and comments
    await _sb.from('votes').delete().eq('problem_id',problemId);
    await _sb.from('comments').delete().eq('problem_id',problemId);
    // Then delete the problem itself
    const {error}=await _sb.from('problems').delete().eq('id',problemId).eq('user_id',currentUser.id);
    if(error){
      // If RLS blocks it try force delete
      await _sb.rpc('force_delete_problem',{pid:problemId});
    }
    showToast('✅ Post deleted!');
    setTimeout(()=>window.location.href='feed.html',1200);
  };
}

// ── VOTE ──
async function castVote(){
  if(hasVoted){showToast('⚠️ You already voted on this!');return;}
  if(!currentUser){showToast('👋 Please login to vote!');setTimeout(()=>window.location.href='auth.html',1500);return;}
  const btn=document.getElementById('vote-btn');
  btn.disabled=true;btn.textContent='Voting...';
  await _sb.from('votes').insert({user_id:currentUser.id,problem_id:problemId});
  await _sb.rpc('increment_vote',{problem_id:problemId});
  hasVoted=true;
  problemData.votes=(problemData.votes||0)+1;
  btn.classList.add('voted');btn.disabled=false;btn.innerHTML='✅ You Voted on This';
  document.getElementById('vote-count').textContent=problemData.votes.toLocaleString();
  showToast('✅ Vote cast! Thank you 🇳🇬');
}

// ── COMMENT FORM ──
function renderCommentForm(){
  const area=document.getElementById('comment-form-area');
  if(!currentUser){
    area.innerHTML='<div class="login-prompt">💬 Want to join the discussion? <a href="auth.html">Login or create a free account</a> to comment.</div>';
    return;
  }
  area.innerHTML='<div class="comment-form"><textarea id="comment-input" placeholder="Share your thoughts on this community problem... (max 300 characters)" maxlength="300" oninput="document.getElementById(\'cc\').textContent=this.value.length+\'/300\'"></textarea><div class="form-footer"><span class="char-count" id="cc">0/300</span><button class="submit-comment" onclick="postComment()">💬 Post Comment</button></div></div>';
}

// ── LOAD COMMENTS ──
async function loadComments(){
  const {data:comments,error}=await _sb.from('comments')
    .select('*, profiles(full_name,state)')
    .eq('problem_id',problemId)
    .is('parent_id',null)
    .order('created_at',{ascending:false});
  if(error){renderCommentsList([]);return;}
  // Load replies for each comment
  const commentIds=(comments||[]).map(c=>c.id);
  let replies=[];
  if(commentIds.length>0){
    const {data:repliesData}=await _sb.from('comments')
      .select('*, profiles(full_name)')
      .in('parent_id',commentIds)
      .order('created_at',{ascending:true});
    replies=repliesData||[];
  }
  renderCommentsList(comments||[],replies);
}

// ── RENDER COMMENTS ──
function renderCommentsList(comments,replies=[]){
  document.getElementById('comment-count').textContent=comments.length+' comment'+(comments.length!==1?'s':'');
  if(!comments.length){
    document.getElementById('comments-list').innerHTML='<div class="no-comments"><p>No comments yet.<br/>Be the first to share your thoughts!</p></div>';
    return;
  }
  document.getElementById('comments-list').innerHTML=comments.map((c,i)=>{
    const name=c.profiles?.full_name||'Anonymous';
    const initials=getInitials(name);
    const isOwner=currentUser&&c.user_id===currentUser.id;
    const liked=likedComments.includes(c.id);
    const likes=c.likes||0;
    const commentReplies=replies.filter(r=>r.parent_id===c.id);

    return '<div class="comment-item" style="animation-delay:'+(i*0.04)+'s" id="ci-'+c.id+'">'
      +'<div class="comment-header">'
      +'<div class="comment-avatar">'+initials+'</div>'
      +'<div><div class="comment-author">'+name+'</div></div>'
      +'<div class="comment-time">'+timeAgo(c.created_at)+'</div>'
      +'</div>'
      // Comment text or edit form
      +'<div class="comment-text" id="ct-'+c.id+'">'+c.content+'</div>'
      +'<div class="comment-edit-form" id="cef-'+c.id+'">'
      +'<textarea id="ce-input-'+c.id+'" rows="3">'+c.content+'</textarea>'
      +'<div class="comment-edit-actions">'
      +'<button class="ce-save" onclick="saveEditComment(\''+c.id+'\')">💾 Save</button>'
      +'<button class="ce-cancel" onclick="cancelEditComment(\''+c.id+'\')">Cancel</button>'
      +'</div></div>'
      // Actions row
      +'<div class="comment-actions">'
      +'<button class="like-btn '+(liked?'liked':'')+'" id="like-'+c.id+'" onclick="likeComment(\''+c.id+'\')">'+( liked?'💚':'🤍')+' '+likes+'</button>'
      +'<button class="reply-btn" onclick="toggleReplyForm(\''+c.id+'\')">💬 Reply</button>'
      +(isOwner?'<button class="edit-comment-btn" onclick="startEditComment(\''+c.id+'\')">✏️ Edit</button>':'')
      +(isOwner?'<button class="delete-comment-btn" onclick="deleteComment(\''+c.id+'\')">🗑️</button>':'')
      +'</div>'
      // Reply form
      +'<div class="reply-form" id="rf-'+c.id+'">'
      +'<textarea id="ri-'+c.id+'" placeholder="Write a reply..." rows="2" maxlength="300"></textarea>'
      +'<div class="reply-form-actions">'
      +'<button class="reply-submit" onclick="postReply(\''+c.id+'\')">↩️ Post Reply</button>'
      +'<button class="reply-cancel" onclick="toggleReplyForm(\''+c.id+'\')">Cancel</button>'
      +'</div></div>'
      // Replies
      +(commentReplies.length>0?
        '<div class="replies-wrap">'+commentReplies.map(r=>{
          const rName=r.profiles?.full_name||'Anonymous';
          const rInitials=getInitials(rName);
          const isReplyOwner=currentUser&&r.user_id===currentUser.id;
          return '<div class="reply-item" id="ri-item-'+r.id+'">'
            +'<div class="reply-header">'
            +'<div class="reply-avatar">'+rInitials+'</div>'
            +'<div class="reply-author">'+rName+'</div>'
            +'<div class="reply-time">'+timeAgo(r.created_at)+'</div>'
            +(isReplyOwner?'<button class="reply-delete" onclick="deleteReply(\''+r.id+'\')">🗑️</button>':'')
            +'</div>'
            +'<div class="reply-text">'+r.content+'</div>'
            +'</div>';
        }).join('')+'</div>'
        :'')
      +'</div>';
  }).join('');
}

// ── POST COMMENT ──
async function postComment(){
  if(!currentUser){showToast('👋 Please login to comment!');return;}
  const input=document.getElementById('comment-input');
  const text=input?.value?.trim();
  if(!text||text.length<3){showToast('⚠️ Please write at least 3 characters.');return;}
  const btn=document.querySelector('.submit-comment');
  btn.disabled=true;btn.textContent='Posting...';
  const {error}=await _sb.from('comments').insert({problem_id:problemId,user_id:currentUser.id,content:text,likes:0,parent_id:null});
  if(error){showToast('❌ Failed to post.');btn.disabled=false;btn.innerHTML='💬 Post Comment';return;}
  input.value='';document.getElementById('cc').textContent='0/300';
  btn.disabled=false;btn.innerHTML='💬 Post Comment';
  showToast('✅ Comment posted!');
  await loadComments();
}

// ── EDIT COMMENT ──
function startEditComment(id){
  document.getElementById('ct-'+id).style.display='none';
  document.getElementById('cef-'+id).classList.add('show');
}
function cancelEditComment(id){
  document.getElementById('ct-'+id).style.display='block';
  document.getElementById('cef-'+id).classList.remove('show');
}
async function saveEditComment(id){
  const text=document.getElementById('ce-input-'+id)?.value?.trim();
  if(!text||text.length<3){showToast('⚠️ Comment too short.');return;}
  const {error}=await _sb.from('comments').update({content:text}).eq('id',id).eq('user_id',currentUser.id);
  if(error){showToast('❌ Could not save edit.');return;}
  document.getElementById('ct-'+id).textContent=text;
  cancelEditComment(id);
  showToast('✅ Comment updated!');
}

// ── DELETE COMMENT ──
async function deleteComment(id){
  const el=document.getElementById('ci-'+id);
  if(el)el.style.opacity='0.4';
  // Delete replies first
  await _sb.from('comments').delete().eq('parent_id',id);
  const {error}=await _sb.from('comments').delete().eq('id',id).eq('user_id',currentUser.id);
  if(error){showToast('❌ Could not delete.');if(el)el.style.opacity='1';return;}
  showToast('✅ Comment deleted!');
  await loadComments();
}

// ── LIKE COMMENT ──
async function likeComment(id){
  const btn=document.getElementById('like-'+id);
  if(likedComments.includes(id)){
    // Unlike
    likedComments=likedComments.filter(x=>x!==id);
    localStorage.setItem('nv_liked_comments',JSON.stringify(likedComments));
    const {data:c}=await _sb.from('comments').select('likes').eq('id',id).single();
    const newLikes=Math.max((c?.likes||0)-1,0);
    await _sb.from('comments').update({likes:newLikes}).eq('id',id);
    if(btn){btn.classList.remove('liked');btn.innerHTML='🤍 '+newLikes;}
    return;
  }
  likedComments.push(id);
  localStorage.setItem('nv_liked_comments',JSON.stringify(likedComments));
  const {data:c}=await _sb.from('comments').select('likes').eq('id',id).single();
  const newLikes=(c?.likes||0)+1;
  await _sb.from('comments').update({likes:newLikes}).eq('id',id);
  if(btn){btn.classList.add('liked');btn.innerHTML='💚 '+newLikes;}
  showToast('💚 Liked!');
}

// ── REPLY ──
function toggleReplyForm(commentId){
  const rf=document.getElementById('rf-'+commentId);
  if(rf){rf.classList.toggle('show');}
  if(!currentUser){showToast('👋 Please login to reply!');window.location.href='auth.html';}
}

async function postReply(parentId){
  if(!currentUser){showToast('👋 Please login to reply!');return;}
  const input=document.getElementById('ri-'+parentId);
  const text=input?.value?.trim();
  if(!text||text.length<2){showToast('⚠️ Reply too short.');return;}
  const {error}=await _sb.from('comments').insert({
    problem_id:problemId,
    user_id:currentUser.id,
    content:text,
    likes:0,
    parent_id:parentId
  });
  if(error){showToast('❌ Failed to post reply.');return;}
  input.value='';
  document.getElementById('rf-'+parentId).classList.remove('show');
  showToast('✅ Reply posted!');
  await loadComments();
}

async function deleteReply(id){
  const el=document.getElementById('ri-item-'+id);
  if(el)el.style.opacity='0.4';
  const {error}=await _sb.from('comments').delete().eq('id',id).eq('user_id',currentUser.id);
  if(error){showToast('❌ Could not delete.');if(el)el.style.opacity='1';return;}
  showToast('✅ Reply deleted!');
  await loadComments();
}

function shareTwitter(){const text=encodeURIComponent('🇳🇬 "'+problemData?.title+'" - Vote on NaijaVoice!\n'+window.location.href+'\n\n#NaijaVoice #Nigeria');window.open('https://twitter.com/intent/tweet?text='+text,'_blank');}
function shareWhatsApp(){const text=encodeURIComponent('🇳🇬 *'+problemData?.title+'*\n\nVote on NaijaVoice:\n'+window.location.href);window.open('https://wa.me/?text='+text,'_blank');}
function copyLink(){navigator.clipboard.writeText(window.location.href).then(()=>showToast('🔗 Link copied!'));}

// ── REPORT ──
function showReportModal(problemId,title){
  const modal=document.createElement('div');
  modal.id='report-modal';
  modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:99999;display:flex;align-items:center;justify-content:center;padding:1.5rem;';
  const reasons=[{value:'false_info',label:'❌ False information'},{value:'harassment',label:'😡 Harassment'},{value:'hate_speech',label:'🚫 Hate speech'},{value:'harmful',label:'⚠️ Harmful content'},{value:'privacy',label:'🔒 Privacy violation'},{value:'spam',label:'📢 Spam'},{value:'other',label:'📋 Other'}];
  modal.innerHTML='<div style="background:#fff;border-radius:20px;padding:2rem;max-width:400px;width:100%;max-height:90vh;overflow-y:auto;"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;"><h3 style="font-family:Syne,sans-serif;font-size:1.05rem;font-weight:800;color:#0d1f0f;">🚩 Report This Post</h3><button onclick="document.getElementById(\'report-modal\').remove()" style="background:none;border:none;font-size:1.2rem;cursor:pointer;color:#5a7a5e;">✕</button></div><p style="font-size:0.83rem;color:#5a7a5e;margin-bottom:1rem;line-height:1.5;">Select why you are reporting this post.</p>'+reasons.map(r=>'<label style="display:flex;align-items:flex-start;gap:0.8rem;padding:0.7rem;border:1.5px solid #d4e8d6;border-radius:10px;cursor:pointer;margin-bottom:0.4rem;"><input type="radio" name="report-reason" value="'+r.value+'" style="margin-top:3px;accent-color:#008751;"/><span style="font-size:0.85rem;font-weight:600;color:#1a2e1c;">'+r.label+'</span></label>').join('')+'<textarea id="report-details" placeholder="Additional details (optional)..." style="width:100%;padding:0.7rem;border:1.5px solid #d4e8d6;border-radius:10px;font-family:DM Sans,sans-serif;font-size:0.85rem;resize:vertical;min-height:60px;outline:none;margin:0.5rem 0;" ></textarea><div style="display:flex;gap:0.8rem;margin-top:0.5rem;"><button onclick="document.getElementById(\'report-modal\').remove()" style="flex:1;padding:0.75rem;border:1.5px solid #d4e8d6;border-radius:10px;background:transparent;font-size:0.88rem;cursor:pointer;color:#5a7a5e;">Cancel</button><button onclick="submitReport(\''+problemId+'\',this)" style="flex:2;padding:0.75rem;border:none;border-radius:10px;background:#e53e3e;color:#fff;font-family:Syne,sans-serif;font-size:0.88rem;font-weight:700;cursor:pointer;">🚩 Submit Report</button></div></div>';
  document.body.appendChild(modal);
  modal.onclick=e=>{if(e.target===modal)modal.remove();};
}

async function submitReport(pid,btn){
  const reason=document.querySelector('input[name="report-reason"]:checked')?.value;
  if(!reason){showToast('⚠️ Please select a reason.');return;}
  const details=document.getElementById('report-details')?.value?.trim()||'';
  btn.disabled=true;btn.textContent='Submitting...';
  await _sb.from('reports').insert({problem_id:pid,reason,details,status:'pending',reported_at:new Date().toISOString()});
  try{await _sb.rpc('increment_report_count',{problem_id:pid});}catch(e){}
  document.getElementById('report-modal')?.remove();
  showToast('🚩 Report submitted. Thank you!');
}

async function logout(){await _sb.auth.signOut();window.location.href='index.html';}
init();
